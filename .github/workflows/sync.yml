name: Sync published AgentRadio skill
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/sync.yml']
permissions:
  contents: write
concurrency:
  group: public-skill-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exporter
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch canonical public package
        run: python3 scripts/sync.py
      - name: Commit changed public package
        shell: bash
        run: |
          git add -- skills/agentradio/SKILL.md source.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync skill from published AgentRadio package'
          git push origin HEAD:main
